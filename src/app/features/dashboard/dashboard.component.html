<!-- Escuchamos el evento de colapso del Sidebar -->
<app-sidebar (collapsedChanged)="onSidebarToggle($event)"></app-sidebar>

<!-- Enviamos de manera reactiva el estado al Header -->
<app-header
  [isSidebarCollapsed]="sidebarCollapsed()"
  [hederValue]="hederValue()"
></app-header>

<!-- Contenedor maestro con respuesta elástica al Sidebar -->
<div
  class="gemini-dashboard-viewport"
  [class.sidebar-is-collapsed]="sidebarCollapsed()"
>
  <div class="container-fluid py-4 px-4">
    <!-- Título y Objetivo Macro Activo -->
    <div class="mb-4 fade-in">
      <h1 class="h3 fw-bold text-dark mb-1">AI Task Orchestrator</h1>
      <p class="text-muted small">
        Objetivo Activo:
        <span class="fw-semibold text-dark text-decoration-underline"
          >Lanzar campaña de Marketing App móvil</span
        >
      </p>
    </div>

    <!-- Rejilla de Columnas Estilo CoreUI Cards -->
    <div class="row g-4 fade-in">
      @for (status of statuses; track status) {
        <div class="col-12 col-md-6 col-xl-3">
          <div
            class="card kanban-column-card border-light shadow-sm bg-white"
            (dragover)="$event.preventDefault()"
            (drop)="onDrop($event, status)"
          >
            <!-- Encabezado de la Columna Kanban -->
            <div
              class="card-header border-bottom-0 bg-transparent d-flex justify-content-between align-items-center pt-3 px-3"
            >
              <h2
                class="fs-6 fw-bold text-uppercase text-secondary tracking-wide m-0"
              >
                {{ status.replace("_", " ") }}
              </h2>
              <span
                class="badge bg-light text-muted border rounded px-2 py-1 small fw-semibold"
              >
                {{ getTasksByStatus(status)().length }}
              </span>
            </div>

            <!-- Dropzone: Cuerpo de la columna que aloja los TaskCards -->
            <div
              class="card-body d-flex flex-column gap-3 p-3 column-drop-zone"
            >
              @for (task of getTasksByStatus(status)(); track task.id) {
                <app-task-card [task]="task" />
              } @empty {
                <div
                  class="empty-state-box flex-grow-1 d-flex align-items-center justify-content-center border border-dashed rounded-3 p-4 bg-light"
                >
                  <p class="text-muted small m-0">No hay tareas en esta fase</p>
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
